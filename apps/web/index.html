<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>워드앤코드 | Word & Code</title>
    <meta name="description" content="워드앤코드는 웹·모바일 서비스 개발과 디지털 전환을 돕는 IT 솔루션 기업입니다." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  </head>
  <body>
    <script>
      // 404.html 이 넘겨준 원래 경로를 주소창에 복원한 뒤 라우터가 처리하게 한다.
      (function () {
        var params = new URLSearchParams(location.search);
        var redirect = params.get('redirect');
        if (redirect) {
          history.replaceState(null, '', location.pathname.replace(/\/$/, '/') + redirect.replace(/^\//, ''));
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
